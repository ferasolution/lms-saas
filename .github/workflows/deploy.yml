name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lms_install_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, bcmath
          coverage: none

      - name: Install PHP packages
        run: composer install --prefer-dist --no-interaction --no-progress

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        run: npm ci && npm run build

      - name: Run tests
        env:
          MYSQL_TEST_HOST: 127.0.0.1
          MYSQL_TEST_PORT: 3306
          MYSQL_TEST_DATABASE: lms_install_test
          MYSQL_TEST_USERNAME: root
          MYSQL_TEST_PASSWORD: root
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      APP_URL: ${{ vars.APP_URL || 'https://lms.ferasolution.com' }}
    steps:
      - name: Check deploy secrets
        id: check
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ]; then
            echo "::notice::Deploy skipped: add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD in Settings > Secrets > Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true'

      - uses: shivammathur/setup-php@v2
        if: steps.check.outputs.ready == 'true'
        with:
          php-version: '8.3'
          coverage: none

      - name: Install production PHP packages
        if: steps.check.outputs.ready == 'true'
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        if: steps.check.outputs.ready == 'true'
        run: npm ci && npm run build

      - name: Prepare writable folders and installer key
        if: steps.check.outputs.ready == 'true'
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # The web installer (/install) asks for the FTP password and checks it against this hash.
          # It lives in storage/, outside the public web root, and is deleted once installed.
          mkdir -p storage/app
          php -r 'echo hash("sha256", "lms-install:" . getenv("FTP_PASSWORD"));' > storage/app/install.key

          # FTP skips empty folders, so put a marker file in each one Laravel writes to.
          rm -f bootstrap/cache/*.php
          for d in storage/app/public storage/framework/cache/data storage/framework/sessions \
                   storage/framework/views storage/logs bootstrap/cache; do
            mkdir -p "$d" && touch "$d/.keep"
          done

      - name: Upload over FTPS
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: loose
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          timeout: 600000
          # Only changed files are uploaded after the first deploy.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            tests/**
            .env
            .env.backup
            .env.production

      - name: Run migrations and rebuild caches
        if: steps.check.outputs.ready == 'true'
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::notice::Files uploaded. Finish setup at $APP_URL/install, then save the token it shows as the DEPLOY_TOKEN secret."
            exit 0
          fi
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            -H "Accept: application/json" \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" \
            "$APP_URL/api/_deploy")
          python3 -m json.tool response.json 2>/dev/null || cat response.json
          case "$code" in
            200) echo "Deploy hook finished." ;;
            404) echo "::warning::Site is not installed yet. Open $APP_URL/install." ;;
            403) echo "::error::DEPLOY_TOKEN in GitHub does not match the one on the server."; exit 1 ;;
            *)   echo "::error::Deploy hook failed with HTTP $code."; exit 1 ;;
          esac
