name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath
          coverage: none

      - name: Install PHP packages
        run: composer install --prefer-dist --no-interaction --no-progress

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        run: npm ci && npm run build

      - name: Run tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      APP_URL: ${{ vars.APP_URL || 'https://lms.ferasolution.com' }}
    steps:
      - name: Check deploy secrets
        id: check
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$DEPLOY_TOKEN" ]; then
            echo "::notice::Deploy skipped: add FTP_SERVER, FTP_USERNAME, FTP_PASSWORD and DEPLOY_TOKEN in Settings > Secrets > Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true'

      - uses: shivammathur/setup-php@v2
        if: steps.check.outputs.ready == 'true'
        with:
          php-version: '8.3'
          coverage: none

      - name: Install production PHP packages
        if: steps.check.outputs.ready == 'true'
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        if: steps.check.outputs.ready == 'true'
        run: npm ci && npm run build

      - name: Prepare writable folders
        if: steps.check.outputs.ready == 'true'
        run: |
          # FTP skips empty folders, so put a marker file in each one Laravel writes to.
          rm -f bootstrap/cache/*.php
          for d in storage/app/public storage/framework/cache/data storage/framework/sessions \
                   storage/framework/views storage/logs bootstrap/cache; do
            mkdir -p "$d" && touch "$d/.keep"
          done

      - name: Upload over FTPS
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: loose
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          timeout: 600000
          # Only changed files are uploaded after the first deploy.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            tests/**
            .env
            .env.backup
            .env.production

      - name: Run migrations and rebuild caches
        if: steps.check.outputs.ready == 'true'
        run: |
          set -o pipefail
          curl -sS --fail-with-body -X POST \
            -H "Accept: application/json" \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" \
            "$APP_URL/api/_deploy" | python3 -m json.tool
